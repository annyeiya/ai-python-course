name: ci

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установить проверки
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ruff pytest pandas numpy scikit-learn pydantic pyyaml joblib
      - name: Стиль кода
        run: ruff check .
      - name: Тесты (появятся в ЛР2 и ЛР5)
        run: |
          if ls tests/test_*.py >/dev/null 2>&1; then pytest tests -q; else echo "тестов пока нет"; fi
