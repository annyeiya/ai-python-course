name: ci

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установить проверки
        run: pip install ruff pytest
      - name: Стиль кода
        run: ruff check .
      - name: Тесты
        run: |
          if ls tests/test_*.py >/dev/null 2>&1; then pytest tests -q; else echo "тестов пока нет"; fi
