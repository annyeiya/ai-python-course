# Настройки ЛР2 (вариант 10 "Шумовые признаки", профиль P1 - табличный).
# Схема настроек описана моделью pydantic: class MLConfig в src/ml_pipeline.py.
# На невалидной конфигурации программа останавливается с объяснением.
dataset_path: data/raw/dataset.csv
hash_manifest_path: data/hash_manifest.json
report_dir: reports/LAB2
model_path: reports/LAB2/ml_model.joblib

# Зерно всей случайности работы (то же, что в ЛР1)
seed: 511

# Разбиение: train 70 / val 15 / test 15 (объявлено в паспорте данных ЛР1)
val_size: 0.15
test_size: 0.15

# Режим чанков: размер чанка в строках
chunk_size: 2000

# Число проходов инкрементальной модели по потоку чанков
chunk_epochs: 10

# Сетка подбора C (подбор ТОЛЬКО на проверочной части)
c_grid: [0.01, 0.03, 0.1, 0.3, 1.0]

# Бутстрэп и повторы измерений
n_bootstrap: 1000
n_repeats: 3

# Допуск расхождения ключевой метрики (accuracy) между режимами
mode_tolerance: 0.01

# Шапка отчёта
author: Нефедова А.А.
report_date: "2026-09-24"
