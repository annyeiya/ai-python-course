# Настройки ЛР3 (вариант 10 "Шумовые признаки", профиль P1 - табличный, модель MLP).
# Схема настроек описана моделью pydantic: class DLConfig в src/dl_pipeline.py.
# На невалидной конфигурации программа останавливается с объяснением.
dataset_path: data/raw/dataset.csv
hash_manifest_path: data/hash_manifest.json
lab2_metrics_path: reports/LAB2/ml_metrics.csv
report_dir: reports/LAB3
checkpoint_path: reports/LAB3/dl_model.pt

# Зерно всей случайности работы (то же, что в ЛР1 и ЛР2)
seed: 511

# Разбиение: train 70 / val 15 / test 15 (как в ЛР2, те же индексы)
val_size: 0.15
test_size: 0.15

# Архитектура MLP и оптимизация
hidden_dims: [128, 64]
dropout: 0.2
lr: 0.001
batch_size: 256
max_epochs: 60

# Ранняя остановка: сколько эпох без улучшения val_loss ждать
patience: 8

# Стриминг: размер чанка csv, читаемого с диска
chunk_size: 2000

# Бутстрэп и допуск расхождения режимов
n_bootstrap: 1000
mode_tolerance: 0.01

# Устройство и детерминизм
device: auto
deterministic: true
num_threads: 1

# Эпох для негативного контроля со снятой фиксацией зерна
seed_control_epochs: 5

# Шапка отчёта
author: Нефедова А.А.
report_date: "2026-10-25"
